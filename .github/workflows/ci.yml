name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: C++ unit tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset host-tests
      - run: cmake --build --preset host-tests
      - run: ctest --preset host-tests

  firmware:
    name: Firmware build (arm-none-eabi-gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: cmake --preset firmware
      - run: cmake --build --preset firmware
      - name: No dynamic allocation linked in
        run: |
          if arm-none-eabi-nm build/firmware/firmware/imu_daq.elf | grep -Ei ' (malloc|calloc|realloc|free|_sbrk)$'; then
            echo "heap functions found in the firmware image"; exit 1
          fi
      - name: Build non-default configurations
        run: |
          cmake -S . -B build/fw-200hz -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=Release -DSAMPLE_RATE_HZ=200 -DI2C_CLOCK_HZ=100000
          cmake --build build/fw-200hz
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware/firmware/imu_daq.elf
            build/firmware/firmware/imu_daq.bin
            build/firmware/firmware/imu_daq.hex
            build/firmware/firmware/imu_daq.map

  python:
    name: Python tools
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tests/python -q
      - name: End-to-end smoke test on a synthetic log
        working-directory: tools
        run: |
          python -m imu_daq simulate --duration 20 --drop 0.002 --corrupt 0.001 --out ../data/synthetic.bin
          python -m imu_daq analyze ../data/synthetic.bin --out ../results/synthetic

  matlab-compat:
    name: MATLAB scripts (run with Octave)
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y octave
          pip install -r tools/requirements.txt
      - run: |
          cd tools
          python -m imu_daq simulate --duration 20 --drop 0.002 --corrupt 0.001 --out ../data/synthetic.bin
          python -m imu_daq analyze ../data/synthetic.bin --out ../results/synthetic --no-plots
      - run: octave --no-gui --eval "addpath('tests/matlab'); check_against_python('data/synthetic.bin','results/synthetic/summary.json')"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror firmware/src/*.cpp firmware/src/*.hpp firmware/include/*.hpp tests/*.cpp
